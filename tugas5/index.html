<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>mencari akun GitHub</h1>
        <div class="search-box">
            <input type="text" id="username" placeholder="Enter GitHub username...">
            <button id="searchBtn">Search</button>
        </div>
        
        <div id="loading" class="status hidden">Loading...</div>
        <div id="error" class="status hidden">User tidak ditemukan error 404</div>
        
        <div id="profile" class="profile-card hidden">
            <img id="avatar" src="" alt="Avatar">
            <h2 id="name"></h2>
            <p id="bio"></p>
            <div class="stats">
                <span>Public Repos: <strong id="repos"></strong></span>
            </div>
            <a id="link" href="" target="_blank">View Profile</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
